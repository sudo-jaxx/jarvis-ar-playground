<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Playground</title><link rel="stylesheet" href="/style.css"></head><body><main class="home"><h1>JARVIS <span>PLAYGROUND</span></h1><p>Motion gaming for up to four players. Use your iPhone as the camera and a Chromebook as the display.</p><section class="panel"><h2>Display mode</h2><p>Create a private room and open the game on this device.</p><button id="create">Create game room</button><p id="status" role="status"></p></section><section class="panel"><h2>Camera mode</h2><p>Open the private camera link provided by your display. Camera access requires your permission.</p></section></main><script>document.querySelector('#create').onclick=async()=>{const s=document.querySelector('#status');s.textContent='Creating room…';try{const r=await fetch('/api/create',{method:'POST'});if(!r.ok)throw Error('Room creation failed');const d=await r.json();sessionStorage.setItem('jarvis-'+d.room,JSON.stringify(d));location.href='/display.html?room='+d.room+'&token='+encodeURIComponent(d.host)}catch(e){s.textContent=e.message}}</script></body></html>
